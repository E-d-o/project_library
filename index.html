<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>library_project</title>
    <link href="./style.css" type="text/css" rel="stylesheet">
</head>

<body>
    <header>

        <h1>Benvenuto alla libreria</h1>
    </header>



    <div class="add-section">
        <label for="new_book">Aggiungi un libro:</label>
        <button type="button" name="new-book" id="new-book">Nuovo
            libro</button>
        <dialog id="book-dialog" popover>
            <div class="container">
                <legend>Aggiungi il tuo libro</legend>
                <form action="" method="POST">
                    <div>
                        <label for="name">Nome:</label>
                        <input type="text" name="name" id="name" required>
                        <span></span>
                    </div>
                    <div>
                        <label for="author">Autore:</label>
                        <input type="text" name="author" id="author">
                        <span></span>
                    </div>
                    <div>
                        <label for="year">Anno:</label>
                        <input type="number" min="1900" name="year" id="year">
                        <span></span>
                    </div>
                    <div>
                        <label for="read">Letto?</label>
                        <input type="checkbox" name="read" id="read">
                        <span></span>
                    </div>

                    <div class="submit">

                        <button type="submit" name="submit-btn" id="submit-btn">Invio</button>

                        <button type="reset" name="reset-btn" id="reset-btn">Reset</button>

                    </div>
                </form>
            </div>
        </dialog>
    </div>

    <div class="book-section">


    </div>



    <script src="./script.js"></script>
</body>

</html>
