<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>library_project</title>
    <link href="./style.css" type="text/css" rel="stylesheet">
</head>

<body>
    <header>

        <h1>Benvenuto alla libreria</h1>
    </header>



    <div class="add-section">
        <label for="new_book">Aggiungi un libro:</label>
        <button type="button" popovertarget="book-dialog" name="new-book" id="new-book">Nuovo
            libro</button>
        <dialog id="book-dialog" popover>
            <legend>Aggiungi il tuo libro</legend>
            <form action="" method="POST">
                <label for="name">Nome:</label>
                <input type="text" name="name" id="name">
                <label for="author">Autore:</label>
                <input type="text" name="author" id="author">
                <label for="year">Anno:</label>
                <input type="date" name="year" id="year">

                <div class="submit">

                    <button type="submit" name="submit" id="submit">Invio</button>

                    <button type="reset" name="reset" id="reset">Reset</button>

                </div>
            </form>
        </dialog>
    </div>

    <div class="book-section">


    </div>



    <script src="./script.js"></script>
</body>

</html>
