<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>library_project</title>
    <link href="./style.css" type="text/css" rel="stylesheet">
</head>

<body>
    <header>

    </header>

    <div>

        <h1>Welcome to the library</h1>
    </div>

    <div class="main_section">
        <label for="new_book">Add a book:</label>
        <button type="button" name="new_book" id="new_book">New book</button>
    </div>
    <fieldset>
        <legend>Add your new book:</legend>
        <form action="" method="POST">
            <label for="name">Book name:</label>
            <input type="text" name="name" id="name">
            <label for="author">Author:</label>
            <input type="text" name="author" id="author">
            <label for="year">Year:</label>
            <input type="date" name="year" id="year">

            <div class="submit">

                <button type="submit" name="submit" id="submit">Submit</button>

                <button type="reset" name="reset" id="reset">Reset</button>

            </div>
        </form>
    </fieldset>


    <script src="./script.js"></script>
</body>

</html>
